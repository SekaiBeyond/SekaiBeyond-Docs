# The docs site: the static files in out/, served by Cloudflare with no code
# of its own. Deployed by .github/workflows/deploy.yml on every push to main,
# or by hand with npm run deploy.
name = "sekaibeyond-docs"
compatibility_date = "2026-10-01"

# Served on its own hostname only. *.workers.dev is blocked in mainland China,
# as it is for the API relay.
workers_dev = false
preview_urls = false

# Cloudflare creates the DNS record and certificate for it on deploy.
routes = [
    { pattern = "docs.sekaibeyond.com", custom_domain = true },
]

[assets]
directory = "./out"
# /en/api-reference serves out/en/api-reference.html, as next build writes it.
html_handling = "auto-trailing-slash"
# out/404.html, from app/global-not-found.tsx.
not_found_handling = "404-page"
